name: 更新市場數據

on:
  schedule:
    # GitHub 用 UTC：22:10 UTC = 台灣 06:10（美股收盤後）；06:10 UTC = 台灣 14:10（台股收盤後）
    - cron: "10 22 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch: {}   # 允許在 Actions 頁面按「Run workflow」手動更新，不影響上面的定時排程

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取最新數據
        run: python update_data.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators.json headlines.json meta.json calendar.json
          if git diff --cached --quiet; then
            echo "沒有新數據"
          else
            git commit -m "自動更新市場數據 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
